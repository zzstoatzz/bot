[[rules]]
path = "src/bot/services/notification_poller.py"
max_lines = 534

[[rules]]
path = "web/src/lib/components/ContextBudget.svelte"
max_lines = 674

[[rules]]
path = "CHANGELOG.md"
max_lines = 517
