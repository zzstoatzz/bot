<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a1018" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<!-- painted before any script arrives; +layout.svelte removes it on mount -->
		<style>
			html { background: #07090f; color: #d6d2c9; }
			#boot { position: fixed; inset: 0 0 auto; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: #0a1018; border-bottom: 1px solid #3a4b56; font: 500 19px/1 system-ui, sans-serif; letter-spacing: 0.18em; color: #e09060; }
			#boot svg { width: 26px; height: 26px; }
			#boot-note { position: fixed; inset: 96px 16px auto; font: 15px/1.6 system-ui, sans-serif; color: #969389; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" aria-hidden="true">
			<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6">
				<polygon points="16,3 27,9 27,23 16,29 5,23 5,9" stroke-linejoin="round" />
				<line x1="16" y1="7.5" x2="16" y2="24.5" stroke-linecap="round" />
				<ellipse cx="16" cy="16" rx="4.6" ry="5.6" />
			</svg>
			PHI
		</div>
		<p id="boot-note" role="status">Loading Phi…</p>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
