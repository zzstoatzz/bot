when:
  - event: push
    branch: main

engine: nixery

dependencies:
  nixpkgs:
    - uv
    - python312
    # manylinux wheels (numpy, pillow) dlopen libstdc++.so.6, which a nix
    # image has nowhere on the default loader path; gcc's lib output ships it
    # and the test step points LD_LIBRARY_PATH at it. not `libgcc`: from
    # 2026-10-15 nixery.dev answers this exact package set with
    # "image build failure", though every subset and superset builds.
    - stdenv.cc.cc.lib

steps:
  # Settings() validates at import and requires the bot's credentials; the
  # suite never authenticates, so placeholders satisfy it. Real secrets stay
  # on heavypad.
  - name: test
    environment:
      BLUESKY_HANDLE: ci.invalid
      BLUESKY_PASSWORD: ci
    command: |
      export LD_LIBRARY_PATH="$(dirname "$(ls /nix/store/*-gcc-*-lib/lib/libstdc++.so.6 | head -1)")"
      uv sync --frozen
      uv run pytest -q
